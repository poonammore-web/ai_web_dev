<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Web Dev Starter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="src/styles.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">AI Web Dev</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row">
            <div class="col-md-8">
                <h1 class="mb-3">Bootstrap + Vanilla JS Starter</h1>
                <p class="lead">This scaffold includes Bootstrap, a CSS file, and a small `app.js` starter.</p>

                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Interactive demo</h5>
                        <p class="card-text">Click the button to see the JavaScript starter in action.</p>
                        <button id="demoBtn" class="btn btn-primary">Click me</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <h5>Notes</h5>
                <ul>
                    <li>Open `index.html` in your browser.</li>
                    <li>Or run a dev server (see `package.json`).</li>
                </ul>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/app.js"></script>
</body>

</html>
